<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인 자료실</div>
    <h1>가상 자료실</h1>
    <p>로그인한 계정의 가상 메모를 관리합니다.</p>
    <div class="notice">3단계는 신원만 확인합니다. 다른 사람의 메모 ID를 알면 접근·수정·삭제할 수 있는 약점이 남아 있습니다.</div>
    <form id="login"><label>이메일 <input id="email" type="email" autocomplete="username" required></label><label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form>
    <button id="logout" hidden>로그아웃</button>
    <p id="status" role="status"></p>
    <section id="workspace" hidden>
      <form id="editor"><input id="note-id" type="hidden"><label>제목 <input id="title" required maxlength="200"></label><label>본문 <textarea id="body" maxlength="10000"></textarea></label><button>저장</button><button type="button" id="cancel">새 메모</button></form>
      <ul id="notes" aria-live="polite"></ul>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
